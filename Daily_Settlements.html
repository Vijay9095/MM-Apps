<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMROADWAYS — PDF Merger Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: white;
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }

  header .logo {
    width: 40px; height: 40px;
    background: #e94560;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  header h1 { font-size: 22px; font-weight: 600; }
  header p { font-size: 13px; opacity: 0.7; margin-top: 2px; }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 20px;
  }

  /* Upload Zone */
  .upload-zone {
    border: 2.5px dashed #b0b8d0;
    border-radius: 16px;
    background: white;
    text-align: center;
    padding: 48px 24px;
    cursor: pointer;
    transition: all 0.25s;
    margin-bottom: 24px;
  }
  .upload-zone:hover, .upload-zone.drag-over {
    border-color: #e94560;
    background: #fff5f7;
  }
  .upload-zone .upload-icon {
    font-size: 48px;
    margin-bottom: 12px;
  }
  .upload-zone h2 {
    font-size: 18px;
    color: #1a1a2e;
    margin-bottom: 6px;
  }
  .upload-zone p {
    color: #6b7a99;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .upload-zone input[type="file"] { display: none; }

  .btn-upload {
    background: #e94560;
    color: white;
    border: none;
    padding: 11px 28px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .btn-upload:hover { background: #c73652; }
  .btn-upload:active { transform: scale(0.97); }

  /* File List */
  .file-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 24px;
  }

  .file-item {
    background: white;
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    border: 1px solid #e8ecf4;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform: translateY(-6px); } to { opacity:1; transform: translateY(0); } }

  .file-icon {
    width: 42px; height: 42px;
    background: #fff0f3;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .file-info { flex: 1; min-width: 0; }
  .file-name {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #1a1a2e;
  }
  .file-meta { font-size: 12px; color: #8894b0; margin-top: 2px; }

  .file-order {
    background: #e94560;
    color: white;
    border-radius: 50%;
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .btn-remove {
    background: none;
    border: none;
    cursor: pointer;
    color: #aab2c8;
    font-size: 18px;
    padding: 4px 6px;
    border-radius: 6px;
    transition: color 0.15s, background 0.15s;
    flex-shrink: 0;
  }
  .btn-remove:hover { color: #e94560; background: #fff0f3; }

  /* Controls */
  .controls {
    background: white;
    border-radius: 14px;
    padding: 20px 24px;
    margin-bottom: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    border: 1px solid #e8ecf4;
  }
  .controls h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 16px;
    color: #1a1a2e;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .controls-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .control-group label {
    font-size: 12px;
    color: #6b7a99;
    font-weight: 600;
    display: block;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .control-group select,
  .control-group input[type="number"] {
    width: 100%;
    padding: 9px 12px;
    border: 1.5px solid #e0e5f0;
    border-radius: 8px;
    font-size: 13px;
    color: #1a1a2e;
    background: #f8f9fc;
    outline: none;
    transition: border-color 0.2s;
  }
  .control-group select:focus,
  .control-group input[type="number"]:focus {
    border-color: #e94560;
    background: white;
  }

  /* Action Buttons */
  .action-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .btn-merge {
    background: linear-gradient(135deg, #e94560, #c73652);
    color: white;
    border: none;
    padding: 13px 32px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 14px rgba(233,69,96,0.3);
  }
  .btn-merge:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(233,69,96,0.35); }
  .btn-merge:active { transform: scale(0.97); }
  .btn-merge:disabled {
    background: #c4cad8;
    box-shadow: none;
    cursor: not-allowed;
    transform: none;
  }

  .btn-clear {
    background: white;
    color: #6b7a99;
    border: 1.5px solid #e0e5f0;
    padding: 13px 24px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-clear:hover { border-color: #e94560; color: #e94560; }

  /* Progress */
  .progress-bar-wrap {
    background: #e8ecf4;
    border-radius: 100px;
    height: 6px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #e94560, #ff8c69);
    border-radius: 100px;
    transition: width 0.3s ease;
    width: 0%;
  }
  .progress-label {
    font-size: 13px;
    color: #6b7a99;
    text-align: center;
  }
  .progress-wrap { margin-bottom: 20px; }

  /* Preview Section */
  .preview-section {
    background: white;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    border: 1px solid #e8ecf4;
    margin-bottom: 24px;
  }

  .preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid #f0f2f8;
  }
  .preview-header h3 {
    font-size: 16px;
    font-weight: 600;
    color: #1a1a2e;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .page-count {
    background: #e94560;
    color: white;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }

  .btn-download {
    background: #16a085;
    color: white;
    border: none;
    padding: 10px 22px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.2s;
  }
  .btn-download:hover { background: #138a72; }

  /* Page Grid */
  .pages-grid {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .merged-page {
    border: 1.5px solid #e8ecf4;
    border-radius: 12px;
    overflow: hidden;
  }

  .merged-page-label {
    background: #f8f9fc;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
    color: #6b7a99;
    border-bottom: 1px solid #e8ecf4;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .merged-page-label .page-badge {
    background: #1a1a2e;
    color: white;
    border-radius: 5px;
    padding: 2px 8px;
    font-size: 11px;
  }

  .two-col-canvases {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    background: #e8ecf4;
  }

  .canvas-wrapper {
    background: white;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .canvas-label {
    font-size: 11px;
    color: #6b7a99;
    padding: 8px 12px 6px;
    font-weight: 600;
    width: 100%;
    background: #fdfdff;
    border-bottom: 1px solid #f0f2f8;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .canvas-wrapper canvas {
    max-width: 100%;
    display: block;
  }

  .canvas-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 200px;
    color: #b0b8d0;
    font-size: 13px;
    background: #fafbff;
    border-left: 1px solid #e8ecf4;
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 16px;
    background: #f8f9fc;
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .stat-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #6b7a99;
  }
  .stat-item strong { color: #1a1a2e; font-size: 15px; }

  /* empty state */
  .empty-state {
    text-align: center;
    padding: 48px;
    color: #8894b0;
    font-size: 14px;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #1a1a2e;
    color: white;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    z-index: 9999;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity:0; } to { transform: translateY(0); opacity:1; } }

  @media (max-width: 600px) {
    .controls-grid { grid-template-columns: 1fr; }
    .two-col-canvases { grid-template-columns: 1fr; }
    .canvas-empty { border-left: none; border-top: 1px solid #e8ecf4; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">📄</div>
  <div>
    <h1>PDF Merger — 2-Up Layout</h1>
    <p>Multiple PDF files upload → Merge → Page-level 2-column view → Download</p>
  </div>
</header>

<div class="container">

  <!-- Upload Zone -->
  <div class="upload-zone" id="uploadZone">
    <input type="file" id="fileInput" accept="application/pdf" multiple>
    <div class="upload-icon">📁</div>
    <h2>PDF Files-ஐ இங்கே Drag & Drop பண்ணுங்கள்</h2>
    <p>அல்லது கீழே உள்ள button-ஐ click பண்ணி files select பண்ணுங்கள் (Multiple files OK)</p>
    <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
      📂 PDF Files தேர்ந்தெடு
    </button>
  </div>

  <!-- File List -->
  <div class="file-list" id="fileList"></div>

  <!-- Controls -->
  <div class="controls" id="controlsSection" style="display:none;">
    <h3>⚙️ Settings</h3>
    <div class="controls-grid">
      <div class="control-group">
        <label>Layout</label>
        <select id="layoutSelect">
          <option value="side-by-side">Side-by-Side (2 files per page)</option>
          <option value="single">Single Column</option>
        </select>
      </div>
      <div class="control-group">
        <label>Page Scale (%)</label>
        <input type="number" id="scaleInput" value="100" min="50" max="200" step="10">
      </div>
    </div>
  </div>

  <!-- Action Bar -->
  <div class="action-bar" id="actionBar" style="display:none;">
    <button class="btn-merge" id="mergeBtn" onclick="startMerge()">
      🔀 Merge & Preview
    </button>
    <button class="btn-clear" onclick="clearAll()">
      🗑 Clear All
    </button>
  </div>

  <!-- Progress -->
  <div class="progress-wrap" id="progressWrap" style="display:none;">
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-label" id="progressLabel">Processing...</div>
  </div>

  <!-- Stats -->
  <div class="stats-bar" id="statsBar" style="display:none;"></div>

  <!-- Preview -->
  <div class="preview-section" id="previewSection" style="display:none;">
    <div class="preview-header">
      <h3>🖥 Merged Preview <span class="page-count" id="pageCountBadge">0 pages</span></h3>
      <button class="btn-download" id="downloadBtn" onclick="downloadMergedPDF()">
        ⬇️ Download PDF
      </button>
    </div>
    <div class="pages-grid" id="pagesGrid"></div>
  </div>

</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let uploadedFiles = [];
let mergedPdfBytes = null;

const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');

// Drag and Drop
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  const files = Array.from(e.dataTransfer.files).filter(f => f.type === 'application/pdf');
  addFiles(files);
});

fileInput.addEventListener('change', () => {
  addFiles(Array.from(fileInput.files));
  fileInput.value = '';
});

function addFiles(files) {
  files.forEach(f => {
    if (!uploadedFiles.find(x => x.name === f.name && x.size === f.size)) {
      uploadedFiles.push(f);
    }
  });
  renderFileList();
  showHideControls();
}

function renderFileList() {
  const list = document.getElementById('fileList');
  list.innerHTML = '';
  uploadedFiles.forEach((f, i) => {
    const size = (f.size / 1024).toFixed(1) + ' KB';
    const item = document.createElement('div');
    item.className = 'file-item';
    item.innerHTML = `
      <div class="file-order">${i + 1}</div>
      <div class="file-icon">📄</div>
      <div class="file-info">
        <div class="file-name" title="${f.name}">${f.name}</div>
        <div class="file-meta">${size} &nbsp;•&nbsp; PDF</div>
      </div>
      <button class="btn-remove" onclick="removeFile(${i})" title="Remove">✕</button>
    `;
    list.appendChild(item);
  });
}

function removeFile(i) {
  uploadedFiles.splice(i, 1);
  renderFileList();
  showHideControls();
  hidePrevResults();
}

function clearAll() {
  uploadedFiles = [];
  mergedPdfBytes = null;
  renderFileList();
  showHideControls();
  hidePrevResults();
}

function hidePrevResults() {
  document.getElementById('previewSection').style.display = 'none';
  document.getElementById('statsBar').style.display = 'none';
  document.getElementById('pagesGrid').innerHTML = '';
}

function showHideControls() {
  const show = uploadedFiles.length > 0;
  document.getElementById('controlsSection').style.display = show ? 'block' : 'none';
  document.getElementById('actionBar').style.display = show ? 'flex' : 'none';
}

function setProgress(pct, label) {
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = label;
}

async function startMerge() {
  if (uploadedFiles.length === 0) return showToast('⚠️ Files இல்லை. Upload பண்ணுங்கள்.');
  if (uploadedFiles.length === 1) return showToast('ℹ️ குறைந்தது 2 files upload பண்ணுங்கள்.');

  const mergeBtn = document.getElementById('mergeBtn');
  mergeBtn.disabled = true;
  mergeBtn.textContent = '⏳ Processing...';
  document.getElementById('progressWrap').style.display = 'block';
  hidePrevResults();

  try {
    const layout = document.getElementById('layoutSelect').value;
    const scale = parseFloat(document.getElementById('scaleInput').value) / 100;

    // 1. Read all PDFs
    setProgress(10, 'PDF files படிக்கிறது...');
    const pdfDocs = [];
    for (let i = 0; i < uploadedFiles.length; i++) {
      const arrBuf = await uploadedFiles[i].arrayBuffer();
      const pdfjs = await pdfjsLib.getDocument({ data: arrBuf.slice(0) }).promise;
      const pdflib = await PDFLib.PDFDocument.load(arrBuf);
      pdfDocs.push({ name: uploadedFiles[i].name, pdfjs, pdflib, pageCount: pdfjs.numPages });
      setProgress(10 + (i / uploadedFiles.length) * 30, `File ${i+1}/${uploadedFiles.length} படிக்கிறது...`);
    }

    // 2. Build merged PDF using pdf-lib
    setProgress(45, 'PDF merge பண்றோம்...');
    const mergedDoc = await PDFLib.PDFDocument.create();

    if (layout === 'side-by-side') {
      // pair files: file0 & file1 side by side, file2 & file3, etc.
      const maxPages = Math.max(...pdfDocs.map(d => d.pageCount));
      const pairs = Math.ceil(uploadedFiles.length / 2);

      for (let pair = 0; pair < pairs; pair++) {
        const leftDoc = pdfDocs[pair * 2];
        const rightDoc = pdfDocs[pair * 2 + 1];

        const pagesLeft = leftDoc ? leftDoc.pageCount : 0;
        const pagesRight = rightDoc ? rightDoc.pageCount : 0;
        const pairMaxPages = Math.max(pagesLeft, pagesRight);

        for (let pi = 0; pi < pairMaxPages; pi++) {
          const mergedPage = mergedDoc.addPage([842, 595]); // A4 Landscape
          const pw = 842, ph = 595;

          // Left side
          if (leftDoc && pi < pagesLeft) {
            const [embeddedPage] = await mergedDoc.embedPdf(leftDoc.pdflib, [pi]);
            const { width: ew, height: eh } = embeddedPage;
            const scW = (pw / 2 - 10) / ew;
            const scH = (ph - 20) / eh;
            const sc = Math.min(scW, scH) * scale;
            const x = ((pw / 2) - ew * sc) / 2;
            const y = (ph - eh * sc) / 2;
            mergedPage.drawPage(embeddedPage, { x, y, width: ew * sc, height: eh * sc });
          }

          // Divider line
          mergedPage.drawLine({
            start: { x: pw / 2, y: 0 },
            end: { x: pw / 2, y: ph },
            color: PDFLib.rgb(0.8, 0.82, 0.88),
            thickness: 1
          });

          // Right side
          if (rightDoc && pi < pagesRight) {
            const [embeddedPage] = await mergedDoc.embedPdf(rightDoc.pdflib, [pi]);
            const { width: ew, height: eh } = embeddedPage;
            const scW = (pw / 2 - 10) / ew;
            const scH = (ph - 20) / eh;
            const sc = Math.min(scW, scH) * scale;
            const x = pw / 2 + ((pw / 2) - ew * sc) / 2;
            const y = (ph - eh * sc) / 2;
            mergedPage.drawPage(embeddedPage, { x, y, width: ew * sc, height: eh * sc });
          }
        }
      }
    } else {
      // Single column merge
      for (const doc of pdfDocs) {
        const pages = await mergedDoc.copyPages(doc.pdflib, doc.pdflib.getPageIndices());
        pages.forEach(p => mergedDoc.addPage(p));
      }
    }

    setProgress(80, 'PDF save பண்றோம்...');
    mergedPdfBytes = await mergedDoc.save();

    // 3. Render Preview
    setProgress(88, 'Preview render பண்றோம்...');
    await renderPreview(pdfDocs, layout);

    setProgress(100, 'முடிந்தது! ✅');

    // Show stats
    const statsBar = document.getElementById('statsBar');
    statsBar.style.display = 'flex';
    statsBar.innerHTML = `
      <div class="stat-item">📁 <strong>${uploadedFiles.length}</strong> Files merged</div>
      <div class="stat-item">📄 <strong>${mergedDoc.getPageCount()}</strong> Total pages</div>
      <div class="stat-item">💾 <strong>${(mergedPdfBytes.length / 1024).toFixed(1)} KB</strong> Size</div>
      <div class="stat-item">🖼 <strong>${layout === 'side-by-side' ? '2-Column' : 'Single'}</strong> Layout</div>
    `;

    showToast('✅ PDF Merge முடிந்தது!');

    setTimeout(() => {
      document.getElementById('progressWrap').style.display = 'none';
    }, 1500);

  } catch (err) {
    console.error(err);
    showToast('❌ Error: ' + err.message);
    document.getElementById('progressWrap').style.display = 'none';
  }

  mergeBtn.disabled = false;
  mergeBtn.innerHTML = '🔀 Merge & Preview';
}

async function renderPreview(pdfDocs, layout) {
  const grid = document.getElementById('pagesGrid');
  grid.innerHTML = '';

  const previewSection = document.getElementById('previewSection');
  previewSection.style.display = 'block';

  if (layout === 'side-by-side') {
    const pairs = Math.ceil(pdfDocs.length / 2);
    let totalMergedPage = 0;

    for (let pair = 0; pair < pairs; pair++) {
      const leftDoc = pdfDocs[pair * 2];
      const rightDoc = pdfDocs[pair * 2 + 1];
      const pagesLeft = leftDoc ? leftDoc.pageCount : 0;
      const pagesRight = rightDoc ? rightDoc.pageCount : 0;
      const pairMaxPages = Math.max(pagesLeft, pagesRight);

      for (let pi = 0; pi < pairMaxPages; pi++) {
        totalMergedPage++;

        const block = document.createElement('div');
        block.className = 'merged-page';

        const leftName = leftDoc ? truncate(leftDoc.name) : '';
        const rightName = rightDoc ? truncate(rightDoc.name) : '';

        block.innerHTML = `
          <div class="merged-page-label">
            <span class="page-badge">Page ${totalMergedPage}</span>
            ${leftName} ${rightDoc ? '↔ ' + rightName : ''}
          </div>
          <div class="two-col-canvases" id="pair-${pair}-page-${pi}"></div>
        `;
        grid.appendChild(block);

        const twoCol = block.querySelector('.two-col-canvases');

        // Left canvas
        const leftWrap = document.createElement('div');
        leftWrap.className = 'canvas-wrapper';
        leftWrap.innerHTML = `<div class="canvas-label">📄 ${leftName} — Page ${pi + 1}</div>`;
        twoCol.appendChild(leftWrap);

        if (leftDoc && pi < pagesLeft) {
          const c = document.createElement('canvas');
          leftWrap.appendChild(c);
          renderPageToCanvas(leftDoc.pdfjs, pi + 1, c);
        } else {
          leftWrap.innerHTML += `<div class="canvas-empty">இந்த page இல்லை</div>`;
        }

        // Right canvas
        const rightWrap = document.createElement('div');
        rightWrap.className = 'canvas-wrapper';
        rightWrap.innerHTML = `<div class="canvas-label">📄 ${rightName ? rightName + ' — Page ' + (pi + 1) : '—'}</div>`;
        twoCol.appendChild(rightWrap);

        if (rightDoc && pi < pagesRight) {
          const c = document.createElement('canvas');
          rightWrap.appendChild(c);
          renderPageToCanvas(rightDoc.pdfjs, pi + 1, c);
        } else {
          rightWrap.innerHTML += `<div class="canvas-empty">${rightDoc ? 'இந்த page இல்லை' : 'File இல்லை'}</div>`;
        }
      }
    }

    document.getElementById('pageCountBadge').textContent = totalMergedPage + ' pages';

  } else {
    let pageNum = 0;
    for (const doc of pdfDocs) {
      for (let pi = 1; pi <= doc.pageCount; pi++) {
        pageNum++;
        const block = document.createElement('div');
        block.className = 'merged-page';
        block.innerHTML = `
          <div class="merged-page-label">
            <span class="page-badge">Page ${pageNum}</span>
            ${truncate(doc.name)} — Page ${pi}
          </div>
          <div class="canvas-wrapper" style="border:none;"></div>
        `;
        grid.appendChild(block);
        const cw = block.querySelector('.canvas-wrapper');
        const c = document.createElement('canvas');
        cw.appendChild(c);
        renderPageToCanvas(doc.pdfjs, pi, c);
      }
    }
    document.getElementById('pageCountBadge').textContent = pageNum + ' pages';
  }
}

async function renderPageToCanvas(pdfjsDoc, pageNum, canvas) {
  try {
    const page = await pdfjsDoc.getPage(pageNum);
    const viewport = page.getViewport({ scale: 1.2 });
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.style.maxWidth = '100%';
    const ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport }).promise;
  } catch (e) {
    console.warn('Canvas render error:', e);
  }
}

function downloadMergedPDF() {
  if (!mergedPdfBytes) return showToast('⚠️ முதலில் Merge பண்ணுங்கள்');
  const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'merged_output.pdf';
  a.click();
  URL.revokeObjectURL(url);
  showToast('⬇️ Download தொடங்கியது!');
}

function truncate(name) {
  return name.length > 30 ? name.substring(0, 28) + '...' : name;
}

function showToast(msg) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
</script>
