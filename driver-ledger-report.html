<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver Ledger Summary Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root { --teal:#17a99f; --blue:#2a6485; --bg:#f0f1f7; --border:#dcdcdc; --text:#333; --red:#e74c3c; }
  * { box-sizing:border-box; }
  body { margin:0; zoom:0.67; background:var(--bg); color:var(--text);
    font-family:"Open Sans","Segoe UI",Arial,sans-serif; font-size:16px; }

  /* Top bar */
  .topbar { display:flex; align-items:center; height:85px; background:#fff;
    border-top:4px solid #4a3a35; border-bottom:1px solid #e3e3e3; }
  .brand { position:relative; width:324px; height:100%; background:var(--teal); color:#fff;
    font-size:27px; display:flex; align-items:center; padding-left:34px; flex-shrink:0; }
  .menu-btn { position:absolute; right:-20px; top:19px; width:40px; height:40px; border-radius:50%;
    background:var(--teal); color:#1b4f4b; display:flex; align-items:center; justify-content:center; font-size:17px; }
  .stats { display:flex; gap:56px; margin-left:100px; text-align:center; }
  .stat .num { font-size:31px; font-weight:600; color:var(--blue); line-height:1.1; }
  .stat .lbl { font-size:15px; text-transform:uppercase; margin-top:6px; }
  .right { margin-left:auto; display:flex; align-items:center; gap:26px; padding-right:18px; }
  .soc { color:#444; font-size:22px; font-weight:600; }
  .user { display:flex; align-items:center; gap:12px; background:#f3f3f6; border-radius:30px; padding:8px 16px 8px 18px; }
  .avatar { width:40px; height:40px; border-radius:50%; background:var(--teal); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; }
  .uname { font-weight:700; font-size:16px; color:#444; line-height:1.1; }
  .urole { font-size:12px; font-weight:700; color:var(--teal); }

  /* Card */
  .card { margin:26px 20px 24px; background:#fff; padding-bottom:30px; }
  .card-head { background:#f7f7f7; min-height:87px; padding:0 20px; display:flex;
    justify-content:space-between; align-items:center; font-size:16px; text-transform:uppercase; }
  .btn { border:none; color:#fff; font-family:inherit; font-size:18px; border-radius:3px; cursor:pointer; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn-create { background:#5bc0de; padding:12px 17px; }
  .btn-load { background:#f0a030; padding:10px 17px; height:45px; }
  .btn-dl { background:var(--teal); font-size:14px; padding:10px 16px; margin-left:10px; }
  .btn-red { background:var(--red); }

  .paste-panel { margin:20px 20px 0; border:1px dashed var(--teal); background:#f4fbfa; padding:16px 18px; }
  .paste-panel[hidden] { display:none; }
  .paste-panel .ph { display:flex; justify-content:space-between; font-weight:700; margin-bottom:10px; }
  .paste-panel .ph span { font-weight:400; font-size:14px; color:#666; }
  .paste-panel textarea { width:100%; min-height:140px; font-family:Consolas,monospace; font-size:14px;
    border:1px solid #bbb; border-radius:3px; padding:10px; resize:vertical; }
  .paste-panel textarea:focus { outline:2px solid var(--teal); }
  .paste-panel .pa { margin-top:12px; display:flex; gap:10px; flex-wrap:wrap; }
  .paste-panel .pa .btn { font-size:15px; padding:10px 16px; }

  .filters { display:flex; gap:41px; padding:20px 0 40px; border-bottom:1px solid #eee; margin:0 20px; align-items:flex-end; }
  .filters label.t { font-weight:700; font-size:18px; display:block; margin-bottom:8px; }
  .box { width:269px; height:43px; border:1px solid #bbb; border-radius:3px; padding:0 14px;
    display:flex; align-items:center; color:#777; font-size:17px; background:#fff; font-family:inherit; }
  select.box { appearance:auto; }
  .daterow { display:flex; align-items:stretch; width:578px; height:46px; border:1px solid #bbb; border-radius:3px; }
  .daterow .addon { background:#e9e9e9; padding:0 16px; display:flex; align-items:center; color:#666; font-size:18px; }
  .daterow .addon:first-child { border-right:1px solid #bbb; }
  .daterow .addon.to { border-left:1px solid #bbb; border-right:1px solid #bbb; }
  .daterow input { flex:1; min-width:0; border:none; padding:0 16px; font-size:18px; color:#444; font-family:inherit; }
  .daterow input:focus { outline:2px solid var(--teal); outline-offset:-2px; }
  .alldates { float:right; font-size:17px; font-weight:400; cursor:pointer; }
  .alldates input { width:19px; height:19px; vertical-align:-3px; margin-right:6px; }

  .toolbar { display:flex; align-items:center; margin:27px 20px 0; }
  .tbtns { display:flex; border:1px solid #ccc; border-radius:3px; position:relative; }
  .tbtns button { padding:10px 16px; font-size:18px; border:none; border-right:1px solid #ccc; background:#fff;
    font-family:inherit; color:var(--text); cursor:pointer; }
  .tbtns button:last-child { border-right:none; }
  .tbtns button:hover { background:#eefaf9; color:var(--teal); }
  .colmenu { position:absolute; top:100%; right:0; margin-top:4px; background:#fff; border:1px solid #ccc;
    box-shadow:0 6px 18px rgba(0,0,0,.12); z-index:20; padding:8px 0; min-width:210px; }
  .colmenu[hidden] { display:none; }
  .colmenu label { display:flex; gap:10px; align-items:center; padding:6px 16px; font-size:16px; cursor:pointer; }
  .colmenu label:hover { background:#eefaf9; }
  .search { margin-left:auto; display:flex; align-items:center; gap:30px; }
  .search .sl { font-size:16px; }
  .sbox { width:709px; height:40px; border:1px solid #ccc; border-radius:3px; padding:0 12px; font-size:16px; font-family:inherit; }
  .sbox:focus { outline:2px solid var(--teal); }
  .info { margin:14px 20px 0; font-size:15px; color:#777; }

  /* Table */
  .table-wrap { margin:10px 20px 0; border:1px solid var(--border); overflow:auto; max-height:640px; }
  table { border-collapse:collapse; width:100%; min-width:1500px; }
  thead th { position:sticky; top:0; background:#fff; text-align:left; font-weight:700; font-size:18px;
    padding:0 14px; height:53px; border-right:1px solid var(--border); border-bottom:2px solid #d0d0d0;
    white-space:nowrap; cursor:pointer; user-select:none; }
  thead th::after { content:"\21C5"; color:#aaa; font-weight:400; margin-left:12px; }
  thead th.asc::after { content:"\25B2"; color:var(--teal); font-size:13px; }
  thead th.desc::after { content:"\25BC"; color:var(--teal); font-size:13px; }
  thead th:last-child { border-right:none; }
  tbody td { padding:10px 14px; font-size:17px; border-right:1px solid var(--border);
    border-bottom:1px solid var(--border); vertical-align:middle; height:103px; line-height:1.45; }
  tbody td:last-child { border-right:none; }
  tbody tr:hover td { background:#f4fbfa; }
  td.bal { font-weight:700; }
  td.bal small { display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  td.bal.pay { color:var(--blue); }
  td.bal.receive { color:var(--red); }
  td.bal.settled { color:#999; }
  td.empty { text-align:center; color:#888; height:140px; }
</style>
</head>
<body>
<div id="capture">

  <div class="topbar">
    <div class="brand">ASSET TRACKER<span class="menu-btn">&#9776;</span></div>
    <div class="stats">
      <div class="stat"><div class="num" id="sPay">0.00</div><div class="lbl">Balance to Pay</div></div>
      <div class="stat"><div class="num" id="sRecv">0.00</div><div class="lbl">Balance to Receive</div></div>
      <div class="stat"><div class="num" id="sTotal">0.00</div><div class="lbl">Total Amount</div></div>
    </div>
    <div class="right">
      <span class="soc">f</span><span class="soc">&#9678;</span><span class="soc">in</span><span class="soc">&#9654;</span>
      <div class="user">
        <div class="avatar">V</div>
        <div><div class="uname">Vignesh@MMR</div><div class="urole">ADMIN</div></div>
        <span>&#8964;</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <span>Driver Ledger Summary Report</span>
      <div data-html2canvas-ignore="true">
        <button class="btn btn-dl" id="pasteBtn">&#128203; Paste Rows</button>
        <button class="btn btn-dl" id="uploadBtn">&#11014; Upload Excel</button>
        <button class="btn btn-dl" id="imgBtn">&#11015; Download Image</button>
        <button class="btn btn-dl btn-red" id="clearBtn">Clear All</button>
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden>
      </div>
    </div>

    <div class="paste-panel" id="pastePanel" data-html2canvas-ignore="true" hidden>
      <div class="ph"><b>Paste rows copied from your software (Ctrl+V)</b><span id="pasteInfo">&mdash;</span></div>
      <textarea id="pasteText" placeholder="Copy the rows/cells from your software or Excel and paste here. Header row is matched automatically; without a header the same column order as this table is used."></textarea>
      <div class="pa">
        <button class="btn btn-load" id="pAdd" disabled>Add to table</button>
        <button class="btn btn-load" id="pReplace" disabled>Replace table</button>
        <button class="btn btn-create" id="pCancel">Cancel</button>
      </div>
    </div>

    <div class="filters" data-html2canvas-ignore="true">
      <div><label class="t">Vehicle</label><select class="box" id="fVeh"></select></div>
      <div><label class="t">Driver</label><select class="box" id="fDrv"></select></div>
      <div><label class="t">Payment Source</label><select class="box" id="fSrc"></select></div>
      <div>
        <label class="t" style="width:578px">Date
          <span class="alldates"><input type="checkbox" id="fAll" checked>All Dates</span></label>
        <div class="daterow">
          <div class="addon">From</div><input id="fFrom" placeholder="dd/mm/yyyy" value="02/10/2026">
          <div class="addon to">To</div><input id="fTo" placeholder="dd/mm/yyyy" value="15/10/2026">
        </div>
      </div>
      <button class="btn btn-load" id="loadBtn">Load</button>
    </div>

    <div class="toolbar" data-html2canvas-ignore="true">
      <div class="tbtns">
        <button id="tCopy">Copy</button><button id="tExcel">Excel</button><button id="tPdf">PDF</button><button id="tCols">Column visibility</button>
        <div class="colmenu" id="colMenu" hidden></div>
      </div>
      <div class="search"><span class="sl">Search:</span><input class="sbox" id="search"></div>
    </div>
    <div class="info" id="info" data-html2canvas-ignore="true"></div>

    <div class="table-wrap" id="tw">
      <table>
        <thead><tr id="hrow"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var COLS = [["vehicleNo","Vehicle No"],["driverName","Driver Name"],["date","Date"],["description","Description"],
    ["paidDate","Paid Date"],["paymentSource","Payment Source"],["previousBalance","Previous Balance"],["credit","Credit"],
    ["debit","Debit"],["currentBalance","Current Balance"],["notes","Notes"],["createdBy","Created By"]];
  var KEYS = COLS.map(function(c){ return c[0]; });
  var NUM = ["previousBalance","credit","debit","currentBalance"];
  var DATES = ["date","paidDate"];
  var AL = { vehicleno:"vehicleNo",vehiclenumber:"vehicleNo",vehicle:"vehicleNo",drivername:"driverName",driver:"driverName",
    date:"date",entrydate:"date",description:"description",desc:"description",particulars:"description",paiddate:"paidDate",
    paymentsource:"paymentSource",payment:"paymentSource",source:"paymentSource",paymentmode:"paymentSource",
    previousbalance:"previousBalance",prevbalance:"previousBalance",openingbalance:"previousBalance",
    credit:"credit",debit:"debit",currentbalance:"currentBalance",balance:"currentBalance",closingbalance:"currentBalance",
    notes:"notes",note:"notes",remarks:"notes",createdby:"createdBy",enteredby:"createdBy" };
  var norm = function(h){ return AL[String(h||"").toLowerCase().replace(/[^a-z0-9]/g,"")] || null; };
  var num = function(v){ if (typeof v === "number") return v; var n = parseFloat(String(v==null?"":v).replace(/[₹,\s]/g,"").replace(/[()]/g,"-")); return isNaN(n)?0:n; };
  var n2 = function(n){ return Math.abs(n).toFixed(2); };
  var pad = function(n){ return ("0"+n).slice(-2); };
  function nd(v){ if (v instanceof Date && !isNaN(v)) return pad(v.getDate())+"/"+pad(v.getMonth()+1)+"/"+v.getFullYear(); return v==null?"":String(v); }
  function pd(s){ var m = String(s||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? new Date(+m[3], m[2]-1, +m[1]) : null; }

  var RAW = [
    ["TN 52 AB 3344","AJITHKUMAR (1929)","11/06/2026","Trip Sheets: 3732","","",0,0,13225,13225,"created via ledger form","Vignesh@MMR 31/07/2026 09:42 PM"],
    ["TN 52 AB 3344","AJITHKUMAR (1929)","12/06/2026","Trip Sheets: 3732","12/06/2026","Axis OD (923030066154137)",13225,8225,0,5000,"created via ledger form","Vignesh@MMR 31/07/2026 09:43 PM"],
    ["TN 52 AB 3344","AJITHKUMAR (1929)","26/06/2026","Trip Sheets: 3870","","",5000,0,2362,7362,"created via ledger form","Vignesh@MMR 31/07/2026 09:43 PM"],
    ["TN 52 AB 3344","AJITHKUMAR (1929)","08/07/2026","Trip Sheets: 3870","08/07/2026","Axis OD (923030066154137)",7362,6362,0,1000,"created via ledger form","Vignesh@MMR 31/07/2026 09:44 PM"],
    ["TN 52 AB 3344","AJITHKUMAR (1929)","10/07/2026","","","",1000,0,500,1500,"Empty","Vignesh@MMR 31/07/2026 09:45 PM"],
    ["TN 52 AB 3344","AJITHKUMAR (1929)","10/07/2026","","","",1500,1000,0,500,"Driver Change Adv","Vignesh@MMR 31/07/2026 09:46 PM"],
    ["TN 52 AA 0099","AJITHKUMAR (1929)","15/08/2026","Trip Sheets: 4308","","",500,0,17880,18380,"created via ledger form","Vignesh@MMR 05/09/2026 03:57 PM"],
    ["TN 52 AA 0099","AJITHKUMAR (1929)","17/08/2026","Trip Sheets: 4308","17/08/2026","Axis OD (923030066154137)",18380,13000,0,5380,"created via ledger form","Vignesh@MMR 05/09/2026 03:58 PM"],
    ["TN 52 AA 0099","AJITHKUMAR (1929)","26/08/2026","Trip Sheets: 4418","","",5380,0,11510,16890,"created via ledger form","Vignesh@MMR 05/09/2026 03:58 PM"],
    ["TN 52 AA 0099","AJITHKUMAR (1929)","29/08/2026","Trip Sheets: 4418","29/08/2026","Axis OD (923030066154137)",16890,11000,0,5890,"created via ledger form","Vignesh@MMR 05/09/2026 03:59 PM"],
    ["TN 52 AA 0099","AJITHKUMAR (1929)","05/09/2026","Trip Sheets: 4493","","",5890,0,8470,14360,"CREATED VIA LEDGER FORM","chenry115@gmail.com 05/09/2026 10:02 PM"]
  ].map(function(a){ var o = {}; KEYS.forEach(function(k,i){ o[k] = a[i]; }); return o; });

  var S = { rows:[], sk:null, sd:1, hidden:{}, q:"", f:{ veh:"", drv:"", src:"", all:true, from:"", to:"" } };

  function prep(r){
    var o = {};
    KEYS.forEach(function(k){ var v = r[k]; o[k] = DATES.indexOf(k)>-1 ? nd(v) : (v==null?"":v); });
    var has = o.currentBalance !== "" && o.currentBalance != null;
    o._bal = has ? num(o.currentBalance) : num(o.previousBalance) + num(o.debit) - num(o.credit);
    o._st = o._bal > 0.004 ? "pay" : (o._bal < -0.004 ? "receive" : "settled");
    return o;
  }

  function filtered(nosort){
    var f = S.f, q = S.q.trim().toLowerCase(), from = pd(f.from), to = pd(f.to);
    var out = S.rows.filter(function(r){
      if (f.veh && r.vehicleNo !== f.veh) return false;
      if (f.drv && r.driverName !== f.drv) return false;
      if (f.src && r.paymentSource !== f.src) return false;
      if (!f.all){ var d = pd(r.date); if (from && (!d || d < from)) return false; if (to && (!d || d > to)) return false; }
      if (q && KEYS.map(function(k){ return String(r[k]); }).join(" ").toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    if (S.sk && !nosort){
      var k = S.sk, dir = S.sd;
      out = out.slice().sort(function(a,b){
        var x, y;
        if (NUM.indexOf(k)>-1){ x = num(a[k]); y = num(b[k]); return (x-y)*dir; }
        if (DATES.indexOf(k)>-1){ x = pd(a[k]); y = pd(b[k]); return ((x?+x:0)-(y?+y:0))*dir; }
        return String(a[k]).toLowerCase().localeCompare(String(b[k]).toLowerCase())*dir;
      });
    }
    return out;
  }

  function cell(td, k, r){
    var v = r[k], s = v==null ? "" : String(v), m, br = function(){ return document.createElement("br"); };
    if (k === "currentBalance"){
      td.className = "bal " + r._st; td.append(n2(r._bal));
      var c = document.createElement("small");
      c.textContent = r._st==="pay" ? "To Pay" : (r._st==="receive" ? "To Receive" : "Settled");
      td.append(br(), c); return;
    }
    if (NUM.indexOf(k) > -1){ td.textContent = s==="" ? "" : n2(num(v)).replace(/^/, num(v)<0?"-":""); return; }
    if ((k==="driverName"||k==="paymentSource") && (m = s.match(/^(.*?)\s*(\([^)]*\))$/))){ td.append(m[1], br(), m[2]); return; }
    if (k==="createdBy" && (m = s.match(/^(.*?)\s*(\d{2}\/\d{2}\/\d{4})\s+(.+)$/))){ td.append(m[1], br(), m[2], br(), m[3]); return; }
    td.textContent = s;
  }

  function plain(r, k){
    if (k === "currentBalance") return n2(r._bal);
    if (NUM.indexOf(k) > -1) return r[k]==="" ? "" : num(r[k]).toFixed(2);
    return String(r[k]==null?"":r[k]);
  }
  function visCols(){ return COLS.filter(function(c){ return !S.hidden[c[0]]; }); }

  function render(){
    var rows = filtered(), cols = visCols(), hr = $("hrow"), tb = $("rows");
    hr.innerHTML = "";
    cols.forEach(function(c){
      var th = document.createElement("th"); th.textContent = c[1];
      if (S.sk === c[0]) th.className = S.sd===1 ? "asc" : "desc";
      th.onclick = function(){ if (S.sk===c[0]) S.sd *= -1; else { S.sk = c[0]; S.sd = 1; } render(); };
      hr.appendChild(th);
    });
    tb.innerHTML = "";
    if (!rows.length){
      var tr0 = document.createElement("tr"), td0 = document.createElement("td");
      td0.className = "empty"; td0.colSpan = cols.length || 1;
      td0.textContent = S.rows.length ? "No matching records found" : "No data. Use Paste Rows or Upload Excel.";
      tr0.appendChild(td0); tb.appendChild(tr0);
    }
    rows.forEach(function(r){
      var tr = document.createElement("tr");
      cols.forEach(function(c){ var td = document.createElement("td"); cell(td, c[0], r); tr.appendChild(td); });
      tb.appendChild(tr);
    });
    /* Balance = last closing balance per driver (in entry order); Total Amount = sum of Axis OD credits */
    var last = {}, pay = 0, recv = 0, axis = 0;
    filtered(true).forEach(function(r){
      last[r.driverName] = r._bal;
      if (/axis\s*od/i.test(r.paymentSource)) axis += num(r.credit);
    });
    Object.keys(last).forEach(function(d){ if (last[d] > 0.004) pay += last[d]; else if (last[d] < -0.004) recv += Math.abs(last[d]); });
    $("sPay").textContent = pay.toFixed(2); $("sRecv").textContent = recv.toFixed(2);
    $("sTotal").textContent = axis.toFixed(2);
    $("info").textContent = "Showing " + rows.length + " of " + S.rows.length + " entries";
    $("clearBtn").disabled = !S.rows.length;
  }

  function fillSelect(id, key, label){
    var sel = $(id), cur = sel.value;
    var vals = [], seen = {};
    S.rows.forEach(function(r){ var v = r[key]; if (v && !seen[v]){ seen[v] = 1; vals.push(v); } });
    sel.innerHTML = "";
    [["", label]].concat(vals.map(function(v){ return [v, v]; })).forEach(function(p){
      var o = document.createElement("option"); o.value = p[0]; o.textContent = p[1]; sel.appendChild(o);
    });
    if (seen[cur]) sel.value = cur;
  }
  function refreshFilters(){
    fillSelect("fVeh","vehicleNo","All Vehicles"); fillSelect("fDrv","driverName","Select Driver");
    fillSelect("fSrc","paymentSource","Select Payment Source");
  }
  function setRows(raw, append){
    var m = raw.map(prep);
    S.rows = append ? S.rows.concat(m) : m;
    refreshFilters(); S.f.veh = $("fVeh").value; S.f.drv = $("fDrv").value; S.f.src = $("fSrc").value;
    render();
  }

  /* Filters */
  $("loadBtn").onclick = function(){
    S.f = { veh:$("fVeh").value, drv:$("fDrv").value, src:$("fSrc").value, all:$("fAll").checked, from:$("fFrom").value, to:$("fTo").value };
    render();
  };
  $("search").oninput = function(){ S.q = this.value; render(); };

  /* Column visibility */
  function buildColMenu(){
    var m = $("colMenu"); m.innerHTML = "";
    COLS.forEach(function(c){
      var l = document.createElement("label"), i = document.createElement("input");
      i.type = "checkbox"; i.checked = !S.hidden[c[0]];
      i.onchange = function(){ if (i.checked) delete S.hidden[c[0]]; else S.hidden[c[0]] = 1; render(); };
      l.append(i, c[1]); m.appendChild(l);
    });
  }
  buildColMenu();
  $("tCols").onclick = function(e){ e.stopPropagation(); $("colMenu").hidden = !$("colMenu").hidden; };
  document.addEventListener("click", function(e){ if (!$("colMenu").contains(e.target)) $("colMenu").hidden = true; });

  /* Copy / Excel / PDF */
  function grid(){ var cols = visCols(); return { head: cols.map(function(c){ return c[1]; }), body: filtered().map(function(r){ return cols.map(function(c){ return plain(r, c[0]); }); }) }; }
  $("tCopy").onclick = function(){
    var g = grid(), t = [g.head].concat(g.body).map(function(r){ return r.join("\t"); }).join("\n"), b = this;
    var done = function(){ b.textContent = "Copied!"; setTimeout(function(){ b.textContent = "Copy"; }, 1200); };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, done);
    else { var ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); done(); }
  };
  $("tExcel").onclick = function(){
    var g = grid(), ws = XLSX.utils.aoa_to_sheet([g.head].concat(g.body)), wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Driver Ledger"); XLSX.writeFile(wb, "driver-ledger-summary-report.xlsx");
  };
  $("tPdf").onclick = function(){
    var g = grid(), doc = new window.jspdf.jsPDF({ orientation:"landscape", unit:"pt", format:"a4" });
    doc.setFontSize(16); doc.setTextColor(42,100,133); doc.text("Driver Ledger Summary Report", 28, 32);
    doc.autoTable({ head:[g.head], body:g.body, startY:44, margin:{ left:28, right:28 },
      styles:{ fontSize:7.5, cellPadding:5, lineColor:[220,220,220], lineWidth:0.5 },
      headStyles:{ fillColor:[23,169,159], textColor:255 }, alternateRowStyles:{ fillColor:[244,251,250] } });
    doc.save("driver-ledger-summary-report.pdf");
  };

  /* Download image */
  $("imgBtn").onclick = function(){
    var el = $("capture"), tw = $("tw"), old = tw.style.maxHeight;
    document.body.style.zoom = "1"; tw.style.maxHeight = "none"; tw.style.overflow = "visible";
    document.querySelectorAll("thead th").forEach(function(t){ t.style.position = "static"; });
    html2canvas(el, { scale:2, backgroundColor:"#f0f1f7", useCORS:true,
      windowWidth: Math.max(document.documentElement.scrollWidth, 1900) })
    .then(function(canvas){
      var a = document.createElement("a"); a.download = "driver-ledger-summary-report.png";
      a.href = canvas.toDataURL("image/png"); a.click();
    }).finally(function(){
      document.body.style.zoom = ""; tw.style.maxHeight = old; tw.style.overflow = "auto";
      document.querySelectorAll("thead th").forEach(function(t){ t.style.position = ""; });
    });
  };

  /* Clear */
  $("clearBtn").onclick = function(){ if (confirm("Clear all loaded ledger data?")){ S.rows = []; refreshFilters(); render(); } };

  /* Upload Excel / CSV */
  $("uploadBtn").onclick = function(){ $("fileInput").click(); };
  $("fileInput").onchange = function(e){
    var file = e.target.files[0]; if (!file) return;
    var rd = new FileReader();
    rd.onload = function(ev){
      try {
        var wb = XLSX.read(new Uint8Array(ev.target.result), { type:"array", cellDates:true });
        var json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:"" });
        var rows = json.map(function(rw){ var o = {}; Object.keys(rw).forEach(function(h){ var k = norm(h); if (k) o[k] = rw[h]; }); return o; })
          .filter(function(o){ return Object.keys(o).length; });
        if (!rows.length) return alert("No recognizable columns found. Check the header names.");
        setRows(rows, false);
      } catch (err) { alert("Could not read this file."); }
    };
    rd.readAsArrayBuffer(file); this.value = "";
  };

  /* Paste rows */
  function parsePaste(text){
    var lines = text.replace(/\r\n?/g,"\n").split("\n").map(function(l){ return l.replace(/\s+$/,""); }).filter(function(l){ return l.trim(); });
    if (!lines.length) return { rows:[], keys:[] };
    var tabs = lines.some(function(l){ return l.indexOf("\t")>-1; });
    var commas = lines.filter(function(l){ return l.indexOf(",")>-1; }).length > lines.length/2;
    var d = tabs ? "\t" : (commas ? "," : null);
    var g = lines.map(function(l){ return (d ? l.split(d) : l.split(/\s{2,}/)).map(function(c){ return c.trim(); }); });
    /* find the header row anywhere in the first lines (skips title lines like "Driver Ledger Summary Report") */
    var hi = -1, i;
    for (i = 0; i < Math.min(g.length, 8); i++){ if (g[i].map(norm).filter(Boolean).length >= 3){ hi = i; break; } }
    var isHead = hi > -1, keys, data;
    if (isHead){ keys = g[hi].map(norm); data = g.slice(hi+1); }
    else { keys = KEYS.slice(); data = g.filter(function(c){ return c.length >= 6; }); }
    var rows = data.map(function(cells){
      var o = {}; keys.forEach(function(k,i){ if (k) o[k] = cells[i] !== undefined ? cells[i] : ""; });
      return o;   /* extra trailing columns (e.g. row id) have no key, so they are ignored */
    }).filter(function(o){ return Object.keys(o).length && (o.vehicleNo || o.driverName || o.date); });
    return { rows:rows, keys:keys, head:isHead };
  }
  function pastePreview(){
    var t = $("pasteText").value;
    if (!t.trim()){ $("pasteInfo").textContent = "\u2014"; $("pAdd").disabled = $("pReplace").disabled = true; return null; }
    var r = parsePaste(t), ok = r.rows.length > 0;
    $("pasteInfo").textContent = r.rows.length + " rows \u00b7 " + r.keys.filter(Boolean).length + " columns matched \u00b7 " + (r.head ? "header detected" : "default column order");
    $("pAdd").disabled = $("pReplace").disabled = !ok; return r;
  }
  function closePaste(){ $("pastePanel").hidden = true; $("pasteText").value = ""; pastePreview(); }
  $("pasteBtn").onclick = function(){ $("pastePanel").hidden = false; $("pasteText").focus(); };
  $("pasteText").oninput = pastePreview;
  $("pCancel").onclick = closePaste;
  $("pAdd").onclick = function(){ var r = pastePreview(); if (r && r.rows.length){ setRows(r.rows, true); closePaste(); } };
  $("pReplace").onclick = function(){
    var r = pastePreview(); if (!r || !r.rows.length) return;
    if (confirm("Replace all existing rows with the " + r.rows.length + " pasted rows?")){ setRows(r.rows, false); closePaste(); }
  };

  setRows(RAW, false);
})();
</script>
</body>
